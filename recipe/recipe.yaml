context:
  version: "2.4.1"
  build_number: 1

package:
  name: json_schema_validator
  version: ${{ version }}

source:
  url: https://github.com/pboettch/json-schema-validator/archive/${{ version }}.tar.gz
  sha256: 0c8bf7ba59bd50e312d82da4bab1d49cf3e2211cfbd659472f9c90505d2a4e4c

build:
  number: ${{ build_number }}

requirements:
  run_exports:
    - ${{ pin_subpackage('json_schema_validator', upper_bound='x.x') }}
  build:
    - cmake
    - ninja
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
  host:
    - nlohmann_json
  run:
    - ${{ pin_compatible('nlohmann_json', upper_bound='x.x.x') }}

tests:
  - package_contents:
      files:
        exists:
          - ${{ "Library/" if win }}include/nlohmann/json-schema.hpp
          - if: win
            then:
              - Library/bin/nlohmann_json_schema_validator.dll
              - Library/lib/nlohmann_json_schema_validator.lib
          - if: linux
            then:
              - lib/libnlohmann_json_schema_validator.so
          - if: osx
            then:
              - lib/libnlohmann_json_schema_validator.dylib
        not_exists:
          # a Release build's targets file; the Debug one means the DLL links the debug runtime
          - if: win
            then: Library/lib/cmake/nlohmann_json_schema_validator/nlohmann_json_schema_validatorTargets-debug.cmake
  - files:
      recipe:
        - test/
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
    script:
      - if: unix
        then:
          - cmake -S test -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$PREFIX
          - cmake --build build
          - ./build/validator_test
        else:
          - cmake -S test -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%LIBRARY_PREFIX%
          - cmake --build build
          - build\validator_test.exe

about:
  homepage: https://github.com/pboettch/json-schema-validator
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: JSON schema validator for JSON for Modern C++

extra:
  recipe-maintainers:
    - JohanMabille
    - asafkahlon
